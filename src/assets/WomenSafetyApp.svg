<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="wsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wsBg)"/>

  <!-- Pulse rings around SOS -->
  <circle cx="400" cy="230" r="150" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.35"/>
  <circle cx="400" cy="230" r="110" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="230" r="72" fill="url(#wsAccent)"/>
  <text x="400" y="243" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="white" text-anchor="middle">SOS</text>

  <!-- Location pin -->
  <g transform="translate(180,340)">
    <path d="M0,0 C-28,0 -50,22 -50,50 C-50,88 0,130 0,130 C0,130 50,88 50,50 C50,22 28,0 0,0 Z" fill="url(#wsAccent)" opacity="0.9"/>
    <circle cx="0" cy="46" r="20" fill="white"/>
  </g>

  <!-- Shield -->
  <g transform="translate(620,360)">
    <path d="M0,-60 L48,-40 L48,10 C48,45 24,68 0,80 C-24,68 -48,45 -48,10 L-48,-40 Z" fill="white" opacity="0.85"/>
    <path d="M-16,0 L-4,14 L20,-16" stroke="#a855f7" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="440" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#7e22ce" text-anchor="middle">Women Safety Web App</text>
  <text x="400" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a855f7" text-anchor="middle">SOS Trigger · Live Location · Python Backend</text>
</svg>
