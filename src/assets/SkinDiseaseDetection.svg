<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="sdNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sdBg)"/>

  <!-- Neural network motif -->
  <g opacity="0.9">
    <g stroke="#c084fc" stroke-width="2" opacity="0.5">
      <line x1="120" y1="150" x2="320" y2="110"/>
      <line x1="120" y1="150" x2="320" y2="200"/>
      <line x1="120" y1="150" x2="320" y2="290"/>
      <line x1="120" y1="260" x2="320" y2="110"/>
      <line x1="120" y1="260" x2="320" y2="200"/>
      <line x1="120" y1="260" x2="320" y2="290"/>
      <line x1="120" y1="370" x2="320" y2="200"/>
      <line x1="120" y1="370" x2="320" y2="290"/>
      <line x1="320" y1="110" x2="520" y2="200"/>
      <line x1="320" y1="200" x2="520" y2="200"/>
      <line x1="320" y1="290" x2="520" y2="200"/>
      <line x1="520" y1="200" x2="680" y2="200"/>
    </g>
    <circle cx="120" cy="150" r="12" fill="url(#sdNode)"/>
    <circle cx="120" cy="260" r="12" fill="url(#sdNode)"/>
    <circle cx="120" cy="370" r="12" fill="url(#sdNode)"/>
    <circle cx="320" cy="110" r="12" fill="url(#sdNode)"/>
    <circle cx="320" cy="200" r="12" fill="url(#sdNode)"/>
    <circle cx="320" cy="290" r="12" fill="url(#sdNode)"/>
    <circle cx="520" cy="200" r="14" fill="url(#sdNode)"/>
    <circle cx="680" cy="200" r="16" fill="url(#sdNode)"/>
  </g>

  <!-- Medical cross badge -->
  <g transform="translate(640,320)">
    <circle cx="0" cy="0" r="46" fill="white" opacity="0.85"/>
    <rect x="-8" y="-26" width="16" height="52" rx="4" fill="#ec4899"/>
    <rect x="-26" y="-8" width="52" height="16" rx="4" fill="#ec4899"/>
  </g>

  <text x="400" y="440" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#7e22ce" text-anchor="middle">Skin Disease Detection</text>
  <text x="400" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a855f7" text-anchor="middle">CNN · TensorFlow/Keras · Python</text>
</svg>
